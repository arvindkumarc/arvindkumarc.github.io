<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doomscroll</title>
  <meta name="description" content="Doomscroll — the algorithm-free firehose. Live feeds from Hacker News, Dev.to, Lobsters, ArXiv, GitHub Trending, and major engineering blogs.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Theme detection -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- React + Babel for the dashboard -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.20.15/babel.min.js"></script>

  <style>
    /* Bridge CSS variables used by the dashboard */
    :root {
      --color-background-primary: var(--color-bg-card);
      --color-background-secondary: var(--color-bg);
      --color-text-primary: var(--color-text);
      --color-text-tertiary: var(--color-text-muted);
      --color-border-tertiary: var(--color-border);
      --border-radius-lg: var(--radius-lg);
    }

    /* Override scroll-reveal animation from main.css */
    .news-container {
      opacity: 1 !important;
      transform: none !important;
      padding: 0.75rem 0 0;
      max-width: 1500px;
      margin: 0 auto;
    }
    /* Break out of the parent .container's 800px cap, and kill main's heavy top padding on the news page only */
    .main .container:has(> .news-container) {
      max-width: none;
      padding-left: 2rem;
      padding-right: 2rem;
    }
    .main:has(.news-container) {
      padding: 0;
      min-height: 0;
    }
    @media (max-width: 640px) {
      .main .container:has(> .news-container) {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }

    /* --- Full-height layout: page itself doesn't scroll; columns scroll independently (desktop only) --- */
    @media (min-width: 980px) {
      html:has(.news-container), body:has(.news-container) {
        height: 100%;
        overflow: hidden;
      }
      .main:has(.news-container) {
        /* Nav removed on this page — fill the entire viewport */
        height: 100vh;
        overflow: hidden;
      }
      .main:has(.news-container) > .container {
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .news-container {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding-bottom: 0;
      }
      .news-app-root {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .news-layout-fill {
        flex: 1;
        min-height: 0;
      }
      .news-main, .news-rail {
        height: 100%;
        overflow-y: auto;
        padding-right: 6px;
      }
      /* Distinct scrollbars per column */
      .news-main {
        scrollbar-width: thin;
        scrollbar-color: var(--color-accent) transparent;
      }
      .news-main::-webkit-scrollbar { width: 8px; }
      .news-main::-webkit-scrollbar-thumb {
        background: var(--color-accent);
        border-radius: 4px;
      }
      .news-main::-webkit-scrollbar-track { background: transparent; }

      .news-rail {
        scrollbar-width: thin;
        scrollbar-color: #1D9E75 transparent;
      }
      .news-rail::-webkit-scrollbar { width: 6px; }
      .news-rail::-webkit-scrollbar-thumb {
        background: #1D9E75;
        border-radius: 3px;
        opacity: 0.6;
      }
      .news-rail::-webkit-scrollbar-track { background: transparent; }
    }

    .news-container h1, .news-container h2, .news-container h3 {
      border-bottom: none !important;
    }

    /* Wordmark for The Wire on the news page */
    .news-wordmark {
      font-weight: 700;
      letter-spacing: 0.5px;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .news-wordmark i {
      font-size: 14px;
      color: var(--color-accent);
    }

    /* Button base style for dashboard */
    .news-dash-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 0.5px solid var(--color-border);
      background: var(--color-bg-card);
      color: var(--color-text);
      font-family: var(--font-body);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .news-dash-btn:hover {
      background: var(--color-accent-light);
      border-color: var(--color-accent);
    }
    [data-theme="dark"] .news-dash-btn:hover {
      background: var(--color-accent-light);
    }

    /* Reset custom cursor for news page (also dark mode) */
    html, body, a, button, [role="button"], input, .nav-link, .nav-toggle {
      cursor: default !important;
    }
    [data-theme="dark"] html, html[data-theme="dark"],
    [data-theme="dark"] body, [data-theme="dark"] a, 
    [data-theme="dark"] button, [data-theme="dark"] [role="button"],
    [data-theme="dark"] input, [data-theme="dark"] .nav-link, [data-theme="dark"] .nav-toggle {
      cursor: default !important;
    }
    a, button, [role="button"], input[type="submit"], .nav-link, .nav-toggle, .news-dash-btn {
      cursor: pointer !important;
    }
    [data-theme="dark"] a, [data-theme="dark"] button,
    [data-theme="dark"] [role="button"], [data-theme="dark"] input[type="submit"],
    [data-theme="dark"] .nav-link, [data-theme="dark"] .nav-toggle {
      cursor: pointer !important;
    }

    /* Responsive grid: 2 cols on desktop, 1 on mobile */
    .news-section-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 768px) {
      .news-section-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* --- Newspaper: hero, secondary row, wire divider, firehose columns --- */
    .news-hero {
      background: var(--color-bg-card);
      border: 0.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 18px 22px 14px;
      margin-bottom: 14px;
    }
    .news-hero-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 1.3px;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
    }
    .news-hero-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FF6B35;
      flex-shrink: 0;
    }
    .news-hero-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .news-hero-link:hover .news-hero-title { color: var(--color-accent); }
    .news-hero-title {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal;
      font-weight: 700;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: -0.5px;
      text-transform: none;
      margin: 0 0 10px;
      padding: 0;
      color: var(--color-text-primary);
      background: transparent;
      border: none;
      border-radius: 0;
      transition: color 0.15s ease;
    }
    .news-hero-title::first-letter {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-style: normal;
      font-size: 3.4em;
      float: left;
      line-height: 0.88;
      margin: 6px 8px 0 0;
      color: var(--color-text-primary);
    }
    .news-hero-link.is-read .news-hero-title { opacity: 0.55; }
    .news-hero-secondary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 0.5px solid var(--color-border-tertiary);
    }
    .news-hero-secondary > a {
      display: block;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .news-hero-sec-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal;
      font-weight: 600;
      font-size: 15px;
      line-height: 1.3;
      margin: 0 0 6px;
      color: var(--color-text-primary);
      transition: color 0.15s ease;
    }
    .news-hero-secondary > a:hover .news-hero-sec-title { color: var(--color-accent); }
    .news-hero-secondary > a.is-read .news-hero-sec-title { opacity: 0.55; }
    .news-hero-sec-rank {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-tertiary);
      letter-spacing: 1px;
      margin-bottom: 4px;
      opacity: 0.7;
    }
    @media (max-width: 768px) {
      .news-hero-title { font-size: 26px; }
      .news-hero-title::first-letter { font-size: 3.4em; }
      .news-hero-secondary { grid-template-columns: 1fr; gap: 14px; }
    }

    .news-wire-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0 14px;
    }
    .news-wire-divider::before, .news-wire-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .news-wire-label {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.6px;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .news-wire-label::before, .news-wire-label::after {
      content: "▒";
      font-size: 8px;
      opacity: 0.4;
      letter-spacing: 0;
    }

    .news-firehose-columns {
      column-count: 2;
      column-gap: 28px;
      column-rule: 0.5px solid var(--color-border-tertiary);
    }
    .news-firehose-columns > a {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      page-break-inside: avoid;
      display: block;
      padding-top: 12px !important;
      padding-bottom: 12px !important;
    }
    @media (max-width: 980px) {
      .news-firehose-columns { column-count: 1; column-rule: none; }
    }

    /* Broadsheet headlines in the main column (skips GitHub rail) */
    .news-main .article-title {
      font-family: Georgia, 'Times New Roman', serif !important;
      font-style: normal !important;
      font-weight: 600 !important;
      font-size: 15px !important;
      line-height: 1.32 !important;
      letter-spacing: -0.1px !important;
      color: var(--color-text-primary) !important;
    }
    .news-main a:hover .article-title { color: var(--color-accent) !important; }

    /* Article descriptions — 30–50 word snippets from RSS feeds */
    .article-description {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal;
      font-size: 11px;
      line-height: 1.45;
      color: var(--color-text-tertiary);
      margin: 4px 0 6px 24px;
      padding: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-hero-dek {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal;
      font-size: 15px;
      line-height: 1.45;
      color: var(--color-text-tertiary);
      margin: 0 0 12px;
      padding: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-hero-link.is-read .news-hero-dek { opacity: 0.55; }
    .news-hero-sec-desc {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal;
      font-size: 11px;
      line-height: 1.4;
      color: var(--color-text-tertiary);
      margin: 0 0 4px;
      padding: 0;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-hero-secondary > a.is-read .news-hero-sec-desc { opacity: 0.55; }

    .news-volume {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    /* Touch-friendly histogram bars: keep visual size, expand tappable area
       vertically. Horizontally bump min-width on narrow screens. */
    @media (hover: none), (max-width: 640px) {
      .news-histo-bar {
        min-width: 8px !important;
        padding-top: 8px;
        padding-bottom: 8px;
        margin-top: -8px;
        margin-bottom: -8px;
      }
    }

    /* Two-column page layout: feed left, GitHub rail right.
       Mobile (< 980px): news (hero + firehose) leads; GitHub rail stacks below. */
    .news-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    .news-main { order: 1; min-width: 0; }
    .news-rail { order: 2; min-width: 0; }
    @media (min-width: 980px) {
      .news-layout {
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 2rem;
      }
      /* Inside the narrow rail, collapse the 2-col GitHub grid to 1 col */
      .news-rail .news-section-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="main">

  <!-- Theme helpers (used by React masthead toggle) -->
  <script>
    window.setNewsTheme = function(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      window.dispatchEvent(new CustomEvent('themechange', { detail: { theme } }));
    };
    window.toggleNewsTheme = function() {
      var newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      window.setNewsTheme(newTheme);
      localStorage.setItem('theme', newTheme);
    };
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) window.setNewsTheme(e.matches ? 'dark' : 'light');
    });
  </script>

  <!-- ====== News Dashboard Component (React/JSX) ====== -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- IndexedDB-backed state (reads + pins) ---
    function usePersistState() {
      const [readUrls, setReadUrls] = useState(new Set());
      const [pinnedUrls, setPinnedUrls] = useState(new Set());
      const [ready, setReady] = useState(false);

      useEffect(function() {
        var db;
        var request = indexedDB.open("news-dashboard", 2);
        request.onupgradeneeded = function(e) {
          db = e.target.result;
          if (!db.objectStoreNames.contains("reads")) {
            db.createObjectStore("reads", { keyPath: "url" });
          }
          if (!db.objectStoreNames.contains("pins")) {
            db.createObjectStore("pins", { keyPath: "url" });
          }
        };
        request.onsuccess = function(e) {
          db = e.target.result;
          window._newsDB = db;
          // Load reads
          var tx1 = db.transaction("reads", "readonly");
          var r1 = tx1.objectStore("reads").getAllKeys();
          r1.onsuccess = function() { setReadUrls(new Set(r1.result)); };
          // Load pins
          var tx2 = db.transaction("pins", "readonly");
          var r2 = tx2.objectStore("pins").getAllKeys();
          r2.onsuccess = function() { setPinnedUrls(new Set(r2.result)); setReady(true); };
        };
        request.onerror = function() { setReady(true); };
      }, []);

      function markRead(url) {
        var db = window._newsDB;
        if (!db) return;
        var tx = db.transaction("reads", "readwrite");
        tx.objectStore("reads").put({ url: url, timestamp: Date.now() });
        setReadUrls(function(prev) { var next = new Set(prev); next.add(url); return next; });
      }

      function togglePin(url) {
        var db = window._newsDB;
        if (!db) return;
        setPinnedUrls(function(prev) {
          var next = new Set(prev);
          if (next.has(url)) {
            next.delete(url);
            var tx = db.transaction("pins", "readwrite");
            tx.objectStore("pins").delete(url);
          } else {
            next.add(url);
            var tx = db.transaction("pins", "readwrite");
            tx.objectStore("pins").put({ url: url, timestamp: Date.now() });
          }
          return next;
        });
      }

      return { readUrls: readUrls, pinnedUrls: pinnedUrls, markRead: markRead, togglePin: togglePin, ready: ready };
    }

    // --- Cloudflare Worker RSS proxy ---

    function timeAgo(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d)) return "";
      const diff = (Date.now() - d) / 1000;
      if (diff < 60) return "just now";
      if (diff < 3600) return Math.floor(diff / 60) + "m ago";
      if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
      return Math.floor(diff / 86400) + "d ago";
    }

    async function fetchHN(limit, endpoint) {
      endpoint = endpoint || "topstories";
      var res = await fetch("https://hacker-news.firebaseio.com/v0/" + endpoint + ".json");
      var ids = (await res.json()).slice(0, limit || 60);
      var items = await Promise.all(
        ids.map(function(id) { return fetch("https://hacker-news.firebaseio.com/v0/item/" + id + ".json").then(function(r) { return r.json(); }); })
      );
      return items.filter(function(i) { return i && i.url; }).map(function(i) {
        return {
          title: i.title,
          url: i.url || "https://news.ycombinator.com/item?id=" + i.id,
          source: "Hacker News",
          points: i.score || 0,
          comments: i.descendants || 0,
          author: i.by || "",
          hnId: i.id,
          date: i.time ? new Date(i.time * 1000).toISOString() : null,
        };
      });
    }

    async function fetchDevTo(tags, limit = 50) {
      const tag = tags[Math.floor(Math.random() * tags.length)];
      const res = await fetch("https://dev.to/api/articles?tag=" + tag + "&per_page=" + limit + "&top=1");
      const data = await res.json();
      return data.map((a) => ({
        title: a.title,
        url: a.url,
        source: "Dev.to · #" + (a.tag_list?.[0] || tag),
        points: a.positive_reactions_count || 0,
        comments: a.comments_count || 0,
        author: (a.user && a.user.name) || "",

    // --- RSS XML parser (handles RSS 2.0 and Atom) ---
    function parseRSSXML(xml, sourceName, opts) {
      var limit = (opts && opts.limit) || 50;
      var doc;
      try {
        var parser = new DOMParser();
        doc = parser.parseFromString(xml, "text/xml");
      } catch (e) { return []; }
      if (!doc || doc.querySelector("parsererror")) return [];

      // Collect all candidate nodes with <title>
      var nodes = doc.getElementsByTagName("item");
      if (!nodes || !nodes.length) nodes = doc.getElementsByTagName("entry");
      if (!nodes || !nodes.length) return [];

      var items = [];
      for (var i = 0; i < nodes.length && items.length < limit; i++) {
        var el = nodes[i];
        // title
        var titleEl = el.getElementsByTagName("title");
        var title = titleEl && titleEl.length ? (titleEl[0].textContent || "") : "";
        if (!title) continue;

        // link: try multiple formats
        var link = "";
        var links = el.getElementsByTagName("link");
        if (links && links.length) {
          for (var li = 0; li < links.length; li++) {
            var l = links[li];
            if (l.getAttribute("rel") === "alternate") { link = l.getAttribute("href") || ""; break; }
            if (!link) link = l.getAttribute("href") || l.textContent || "";
          }
        }

        // date
        var date = "";
        var pubDates = el.getElementsByTagName("pubDate");
        var published = el.getElementsByTagName("published");
        var updated = el.getElementsByTagName("updated");
        if (pubDates && pubDates.length) date = pubDates[0].textContent || "";
        else if (published && published.length) date = published[0].textContent || "";
        else if (updated && updated.length) date = updated[0].textContent || "";

        // author: dc:creator or author/name
        var author = "";
        var creators = el.getElementsByTagNameNS("*", "creator");
        if (creators && creators.length) author = creators[0].textContent || "";
        if (!author) {
          var nameEls = el.getElementsByTagName("name");
          if (nameEls && nameEls.length) author = nameEls[0].textContent || "";
        }

        items.push({ title: title, url: link, source: sourceName, author: author || "", date: date || null });
      }
      return items;
    }

    // --- Fetch RSS via Cloudflare Worker proxy ---
    async function fetchViaProxy(rssUrl) {
      var res = await fetch(RSS_PROXY + "?url=" + encodeURIComponent(rssUrl));
      if (!res.ok) throw new Error("proxy " + res.status);
      return await res.text();
    }

    async function fetchRSS(url, sourceName, limit) {
      try {
        var xml = await fetchViaProxy(url);
        return parseRSSXML(xml, sourceName, { limit: limit || 50 });
      } catch (e) { return []; }
    }

    async function fetchGHRSS(lang, limit) {
      limit = limit || 12;
      var langSlug = lang ? lang.toLowerCase().replace(/ /g, "-") : "";
      var url = lang
        ? "https://mshibanami.github.io/GitHubTrendingRSS/daily/" + langSlug + ".xml"
        : "https://mshibanami.github.io/GitHubTrendingRSS/daily/unknown.xml";
      try {
        var xml = await fetchViaProxy(url);
        var items = parseRSSXML(xml, "GitHub · " + (lang || "All"), { limit: limit });
        if (items.length > 0) {
          items.forEach(function(item) {
            // GitHub trending RSS puts repo description in author field (via dc:creator) — clear it
            item.author = "";
          });
          return items;
        }
        throw new Error("empty");
      } catch (e) {
        // Fallback: scrape GitHub trending via allorigins
        var ghUrl = lang
          ? "https://github.com/trending/" + langSlug + "?since=daily"
          : "https://github.com/trending?since=daily";
        try {
          var res = await fetch(CORS + encodeURIComponent(ghUrl));
          var data = await res.json();
          var html = data.contents || "";
          var repoMatches = [...html.matchAll(/href="\/([\w-]+\/[\w.-]+)"/g)];
          var seen = new Set();
          return repoMatches
            .filter(function(m) {
              var path = m[1];
              if (seen.has(path) || path.includes("trending") || path.split("/").length !== 2) return false;
              seen.add(path);
              return true;
            })
            .slice(0, limit)
            .map(function(m) {
              return { title: m[1], url: "https://github.com/" + m[1], source: "GitHub · " + (lang || "All"), date: null };
            });
        } catch (e2) { return []; }
      }
    }

    const MAX_AGE_MS = 90 * 24 * 60 * 60 * 1000; // 3 months
    function withinMaxAge(item) {
      if (!item.date) return true; // keep undated items (e.g. GitHub trending)
      var t = new Date(item.date).getTime();
      if (isNaN(t)) return true;
      return (Date.now() - t) <= MAX_AGE_MS;
    }

        case "rss": items = await fetchRSS(feed.url, feed.name); break;
        case "gh_rss": items = await fetchGHRSS(feed.lang); break;
        default: return [];
      }
      return items.filter(withinMaxAge);
    }

    // --- Hero scoring: pick the day's standouts ---
    function sourceWeight(src) {
      if (!src) return 0.6;
      if (src.indexOf("Hacker News") === 0) return 1.0;
      if (src.indexOf("Lobsters") === 0) return 0.95;
      if (src.indexOf("ArXiv") === 0) return 0.8;
      if (src.indexOf("Google AI") === 0) return 0.85;
      if (src.indexOf("Meta") === 0 || src.indexOf("Netflix") === 0 || src.indexOf("AWS") === 0) return 0.85;
      if (src.indexOf("Dev.to") === 0) return 0.5;

    function heatScore(item, now) {
      if (!item.date) return 0;
      var ageMs = now - new Date(item.date).getTime();

      if (isNaN(ageHours) || ageHours < 0 || ageHours > 36) return 0;
      var clampedHours = Math.max(1, ageHours);

    function sourceKey(item) {

        } else {

        }

      return top.concat(rest);
    }

      }

        var clean = String(name || "").trim();
        if (!clean) return;
        var slug = slugifyLang(clean);
        if (!slug) return;
        // dedupe against built-ins and existing custom
        var builtIn = SECTIONS.github.feeds.map(function(f) { return slugifyLang(f.lang || "all-languages"); });
        if (builtIn.indexOf(slug) !== -1) return;
        if (langs.map(slugifyLang).indexOf(slug) !== -1) return;
        persist(langs.concat([clean]));
      }
      function remove(name) {
        persist(langs.filter(function(l) { return l !== name; }));
      }
      return { langs: langs, addLang: add, removeLang: remove };
    }

    const addLangBtnS = { display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, padding: "6px 10px", borderRadius: 6, border: "0.5px dashed var(--color-border)", background: "transparent", color: "var(--color-text-muted)", cursor: "pointer", fontFamily: "inherit", width: "100%", justifyContent: "center", marginTop: 8 };
    const addLangFormS = { display: "flex", gap: 6, marginTop: 8 };
    const addLangInputS = { flex: 1, padding: "6px 10px", fontSize: 12, border: "0.5px solid var(--color-border-tertiary)", borderRadius: 6, background: "var(--color-background-primary)", color: "var(--color-text)", outline: "none" };
    const removeLangBtnS = { background: "none", border: "none", color: "var(--color-text-tertiary)", cursor: "pointer", padding: "2px 4px", fontSize: 11, marginLeft: 4 };

    function AddLanguage({ onAdd, compact }) {
      const [editing, setEditing] = useState(false);
      const [value, setValue] = useState("");
      function submit(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (value.trim()) { onAdd(value); setValue(""); setEditing(false); }
      }
      if (!editing) {
        return React.createElement("button", { style: compact ? addLangCompactBtnS : addLangBtnS, onClick: function() { setEditing(true); }, title: "Add a language to track" },
          React.createElement("i", { className: "fas fa-plus", "aria-hidden": true }),
          compact ? "Language" : "Add language"
        );
      }
      return React.createElement("form", { style: addLangFormS, onSubmit: submit },
        React.createElement("input", {
          type: "text",
          autoFocus: true,
          placeholder: "Rust, Go, TypeScript…",
          style: addLangInputS,
          value: value,
          onChange: function(e) { setValue(e.target.value); },
          onKeyDown: function(e) { if (e.key === "Escape") { setEditing(false); setValue(""); } },
        }),
        React.createElement("button", { type: "submit", className: "news-dash-btn" },
          React.createElement("i", { className: "fas fa-check", "aria-hidden": true })
        ),
        React.createElement("button", { type: "button", className: "news-dash-btn", onClick: function() { setEditing(false); setValue(""); } },
          React.createElement("i", { className: "fas fa-xmark", "aria-hidden": true })
        )
      );
    }

    function App() {
      const [lastRefresh, setLastRefresh] = useState(new Date());
      const [globalKey, setGlobalKey] = useState(0);
      const volume = computeVolume();
      const [searchQuery, setSearchQuery] = useState('');
      const [sourceFilter, setSourceFilter] = useState('');
      const [hideRead, setHideRead] = useState(false);
      const [hidePinned, setHidePinned] = useState(false);
      const [filterOpen, setFilterOpen] = useState(false);
      const { readUrls, pinnedUrls, markRead, togglePin, ready } = usePersistState();
      const prevVisit = useLastVisit();
      const { langs: customLangs, addLang, removeLang } = useCustomLangs();

      const ghSection = Object.assign({}, SECTIONS.github, {
        feeds: SECTIONS.github.feeds.concat(customLangs.map(function(name) {
          return { id: "gh_custom_" + slugifyLang(name), name: name, type: "gh_rss", lang: name, icon: "fas fa-code", isCustom: true };
        })),
      });

      const refreshAll = () => {
        setGlobalKey((k) => k + 1);
        setLastRefresh(new Date());
      };

      useEffect(() => {
        const id = setInterval(refreshAll, 30 * 60 * 1000);
        return () => clearInterval(id);
      }, []);

      return (
        <div className="news-app-root">
          <div style={headerBar}>
            <div style={headerLeftS}>
              <a href={"{{ '/' | relative_url }}"} className="news-dash-btn" title="Back to home" aria-label="Back to home" style={iconBtnS}>
                <i className="fas fa-arrow-left" aria-hidden="true" />
              </a>
              <h1 style={headerH1}>
                <i className="fas fa-infinity" style={headerIcon} aria-hidden="true" />
                Doomscroll
              </h1>
              <span style={headerDividerS}>·</span>
              <p style={headerTag}>the algorithm-free firehose</p>
            </div>
            <div style={headerRightS}>
              <span className="news-volume" title="Days since Doomscroll launched">Vol. {volume.vol} · No. {volume.no}</span>
              <span style={headerDividerS}>·</span>
              <p style={headerSub}>
                {lastRefresh.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })} · {lastRefresh.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
              </p>
              <button onClick={() => window.toggleNewsTheme()} className="news-dash-btn" title="Toggle theme" aria-label="Toggle theme" style={iconBtnS}>
                <i className="fas fa-circle-half-stroke" aria-hidden="true" />
              </button>
              <button onClick={refreshAll} className="news-dash-btn" title="Refresh all" aria-label="Refresh all" style={iconBtnS}>
                <i className="fas fa-rotate-right" aria-hidden="true" />
              </button>
            </div>
          </div>

          <div style={searchRowS}>
            <input
              type="text"
              placeholder="Search across the firehose and trending repos…"
              style={searchBarS}
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
            />
            <button
              style={(sourceFilter || hideRead || hidePinned) ? kebabBtnActiveS : kebabBtnS}
              onClick={() => setFilterOpen(function(v) { return !v; })}
              title="Filters"
              aria-label="Filters"
            >
              <i className="fas fa-ellipsis-vertical" aria-hidden="true" />
              {(sourceFilter || hideRead || hidePinned) && <span style={filterDotS} />}
            </button>
            {filterOpen && (
              <div style={popoverS}>
                <p style={popoverLabelS}>Source</p>
                <div style={filterPillsS}>
                  <button
                    style={sourceFilter === '' ? pillActiveS : pillS}
                    onClick={() => setSourceFilter('')}
                  >All</button>
                  {ALL_SOURCES.map(function(src) {
                    return (
                      <button
                        key={src}
                        style={sourceFilter === src ? pillActiveS : pillS}
                        onClick={() => setSourceFilter(sourceFilter === src ? '' : src)}
                      >{src}</button>
                    );
                  })}
                </div>
                <div style={popoverDividerS} />
                <p style={popoverLabelS}>View</p>
                <div style={filterPillsS}>
                  <button
                    style={hideRead ? pillActiveS : pillS}
                    onClick={() => setHideRead(function(v) { return !v; })}
                  >{hideRead ? "✓ Showing unread" : "Hide read"}</button>
                  <button
                    style={hidePinned ? pillActiveS : pillS}
                    onClick={() => setHidePinned(function(v) { return !v; })}
                  >{hidePinned ? "★ Pinned hidden" : "Hide pinned"}</button>
                </div>
              </div>
            )}
          </div>

          <div className="news-layout news-layout-fill">
            <div className="news-main">
              <Section key={"tech-" + globalKey} id="tech" section={SECTIONS.tech} readUrls={readUrls} markRead={markRead} pinnedUrls={pinnedUrls} togglePin={togglePin} searchQuery={searchQuery} sourceFilter={sourceFilter} hideRead={hideRead} hidePinned={hidePinned} prevVisit={prevVisit} hideHeader={true} />
            </div>
            <aside className="news-rail">
              <div style={railHeadS}>
                <p style={railTitleS}>
                  <i className="fab fa-github" style={railTitleIconS} aria-hidden="true" />
                  Trending repos
                </p>
                <AddLanguage onAdd={addLang} compact={true} />
              </div>
              <Section key={"github-" + globalKey} id="github" section={ghSection} readUrls={readUrls} markRead={markRead} pinnedUrls={pinnedUrls} togglePin={togglePin} searchQuery={searchQuery} sourceFilter={sourceFilter} hideRead={hideRead} hidePinned={hidePinned} prevVisit={prevVisit} hideHeader={true} onRemoveLang={removeLang} />
            </aside>
          </div>

          <div style={colophonS}>
            <span>© {lastRefresh.getFullYear()} Doomscroll · the algorithm-free firehose</span>
            <span style={colophonSocialsS}>
              <a href="https://github.com/arvindkumarc" target="_blank" rel="noopener" aria-label="GitHub" style={colophonLinkS}><i className="fab fa-github"></i></a>
              <a href="https://twitter.com/arvindkumarc" target="_blank" rel="noopener" aria-label="Twitter" style={colophonLinkS}><i className="fab fa-twitter"></i></a>
              <a href="https://www.linkedin.com/in/arvindkumarchinniah/" target="_blank" rel="noopener" aria-label="LinkedIn" style={colophonLinkS}><i className="fab fa-linkedin-in"></i></a>
              <a href="https://medium.com/@arvindkumarc" target="_blank" rel="noopener" aria-label="Medium" style={colophonLinkS}><i className="fab fa-medium"></i></a>
            </span>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("news-dashboard"));
    root.render(<App />);
  </script>
</body>
</html>
