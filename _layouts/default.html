<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-logo">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
        <a href="{{ '/projects.html' | relative_url }}" class="nav-link">Projects</a>
        <a href="https://blog.arvindc.in" target="_blank" class="nav-link">Blog <i class="fas fa-external-link-alt fa-xs"></i></a>
        <a href="{{ '/arvindkumarc_profile.pdf' | relative_url }}" target="_blank" class="nav-link">Resume <i class="fas fa-external-link-alt fa-xs"></i></a>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <main class="main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="social-links">
        <a href="https://github.com/arvindkumarc" target="_blank" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://twitter.com/arvindkumarc" target="_blank" aria-label="Twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="https://www.linkedin.com/in/arvindkumarchinniah/" target="_blank" aria-label="LinkedIn">
          <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="https://medium.com/@arvindkumarc" target="_blank" aria-label="Medium">
          <i class="fab fa-medium"></i>
        </a>
      </div>
      <p class="footer-text">&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    const toggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>
</body>
</html>
