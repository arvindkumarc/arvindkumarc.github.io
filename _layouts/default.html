<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Theme detection (runs before render to prevent flash) -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <!-- 3D Background -->
  <canvas id="particles"></canvas>

  <nav class="nav">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-logo">
        <img src="{{ '/images/195248.jpeg' | relative_url }}" alt="" class="nav-avatar">
        {{ site.title }}
      </a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="#projects" class="nav-link">Projects</a>
        <a href="https://blog.arvindc.in" target="_blank" class="nav-link">Blog <i class="fas fa-external-link-alt fa-xs"></i></a>
        <a href="{{ '/arvindkumarc_profile.pdf' | relative_url }}" target="_blank" class="nav-link">Resume <i class="fas fa-external-link-alt fa-xs"></i></a>
        <a href="{{ '/news' | relative_url }}" class="nav-link {% if page.url == '/news/' %}active{% endif %}">News <i class="fas fa-rss fa-xs"></i></a>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
        <i class="fas fa-sun"></i>
      </button>
      <button class="nav-toggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <main class="main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="social-links">
        <a href="https://github.com/arvindkumarc" target="_blank" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://twitter.com/arvindkumarc" target="_blank" aria-label="Twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="https://www.linkedin.com/in/arvindkumarchinniah/" target="_blank" aria-label="LinkedIn">
          <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="https://medium.com/@arvindkumarc" target="_blank" aria-label="Medium">
          <i class="fab fa-medium"></i>
        </a>
      </div>
      <p class="footer-text">&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    </div>
  </footer>

  <script>
    // --- DOM refs ---
    const navLinks = document.querySelector('.nav-links');
    const aboutSection = document.querySelector('.about-section');
    const projectsSection = document.querySelector('.projects-section');
    const hscrollOuter = document.querySelector('.hscroll-outer');
    const hscrollTrack = document.querySelector('.hscroll-track');
    const projectsNavLink = document.querySelector('.nav-link[href="#projects"]');
    const homeNavLink = document.querySelector('.nav-link[href="/"], .nav-link[href="./"]');
    const aboutCards = aboutSection ? aboutSection.querySelectorAll('.project-card') : [];

    // --- Mobile menu ---
    document.querySelector('.nav-toggle').addEventListener('click', () => navLinks.classList.toggle('active'));
    document.querySelectorAll('.nav-link[href^="#"]').forEach(link => {
      link.addEventListener('click', () => navLinks.classList.remove('active'));
    });

    // --- Theme ---
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      window.dispatchEvent(new CustomEvent('themechange', { detail: { theme } }));
    }
    document.querySelector('.theme-toggle').addEventListener('click', () => {
      const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
      localStorage.setItem('theme', newTheme);
    });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) setTheme(e.matches ? 'dark' : 'light');
    });

    // --- Sticky card index ---
    aboutCards.forEach(card => {
      card.style.setProperty('--index', parseInt(card.getAttribute('data-index'), 10) || 0);
    });

    // --- Scroll-triggered reveal ---
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 80);
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.main .container > *').forEach(el => revealObserver.observe(el));

    // --- Horizontal scroll setup ---
    function setupHscroll() {
      if (!hscrollOuter || !hscrollTrack) return;
      if (window.innerWidth <= 640) {
        hscrollOuter.style.height = 'auto';
        hscrollTrack.style.transform = 'none';
        hscrollTrack.querySelectorAll('.project-card').forEach(el => revealObserver.observe(el));
        return;
      }
      const scrollDistance = hscrollTrack.scrollWidth - window.innerWidth + 200;
      hscrollOuter.style.height = (scrollDistance + window.innerHeight) + 'px';
    }

    if (hscrollOuter) {
      setupHscroll();
      window.addEventListener('resize', setupHscroll);
    }

    // --- Unified scroll handler ---
    window.addEventListener('scroll', () => {
      const vh = window.innerHeight;

      // Fade about cards as projects approach
      if (aboutSection && projectsSection) {
        const projectsTop = projectsSection.getBoundingClientRect().top;
        const progress = projectsTop < vh * 0.7
          ? Math.max(0, Math.min(1, (vh * 0.7 - projectsTop) / (vh * 0.3)))
          : 0;
        aboutCards.forEach(card => { card.style.opacity = progress > 0 ? Math.max(0, 1 - progress) : ''; });
      }

      // Nav highlight
      if (projectsSection && projectsNavLink) {
        const inProjects = projectsSection.getBoundingClientRect().top <= 100 && projectsSection.getBoundingClientRect().bottom > 100;
        projectsNavLink.classList.toggle('active', inProjects);
        if (homeNavLink) homeNavLink.classList.toggle('active', !inProjects);
      }

      // Horizontal scroll translation + card reveal
      if (hscrollOuter && hscrollTrack && window.innerWidth > 640) {
        const scrollDistance = hscrollOuter.offsetHeight - vh;
        if (scrollDistance > 0) {
          const progress = Math.max(0, Math.min(1, -hscrollOuter.getBoundingClientRect().top / scrollDistance));
          const maxTranslate = hscrollTrack.scrollWidth - window.innerWidth + 200;
          hscrollTrack.style.transform = 'translateX(-' + (progress * maxTranslate) + 'px)';
          hscrollTrack.querySelectorAll('.project-card:not(.filtered-out)').forEach(card => {
            const r = card.getBoundingClientRect();
            if (r.left < window.innerWidth * 0.85 && r.right > 0) card.classList.add('visible');
          });
        }
      }
    }, { passive: true });

    // --- Filter pills ---
    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        if (!hscrollTrack) return;
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const filter = pill.getAttribute('data-filter');
        hscrollTrack.querySelectorAll('.project-card').forEach(card => {
          const tags = (card.getAttribute('data-tags') || '').split(' ');
          card.classList.toggle('filtered-out', filter !== 'all' && !tags.includes(filter));
        });
        setupHscroll();
        hscrollTrack.style.transform = 'translateX(0)';
        const outerTop = hscrollOuter.getBoundingClientRect().top + window.scrollY - 70;
        window.scrollTo({ top: outerTop, behavior: 'smooth' });
        hscrollTrack.querySelectorAll('.project-card:not(.filtered-out)').forEach(card => card.classList.add('visible'));
      });
    });
  </script>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>
  <script>
    // Floating 3D Objects Background
    (function() {
      const canvas = document.getElementById('particles');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 50;

      const objects = [];
      const lightColors = [0xa5b4fc, 0xc4b5fd, 0xd8b4fe, 0xbfdbfe, 0xc7d2fe];
      const darkColors = [0x22d3ee, 0x67e8f9, 0xa5f3fc, 0x06b6d4, 0x0891b2];
      const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
      let colors = isDark() ? darkColors : lightColors;

      function createMaterial(color, opacity = 0.25) {
        return new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity });
      }

      function updateThreeColors(theme) {
        colors = theme === 'dark' ? darkColors : lightColors;
        objects.forEach(obj => {
          obj.traverse(child => {
            if (child.isMesh && child.material && child.material.color) {
              const newColor = colors[Math.floor(Math.random() * colors.length)];
              child.material.color.setHex(newColor);
            }
          });
        });
      }

      window.addEventListener('themechange', (e) => updateThreeColors(e.detail.theme));

      function createSatellite() {
        const group = new THREE.Group();
        const color = colors[Math.floor(Math.random() * colors.length)];
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 0.6), createMaterial(color));
        group.add(body);
        const panel1 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.05), createMaterial(color, 0.3));
        panel1.position.x = 1.2; group.add(panel1);
        const panel2 = panel1.clone(); panel2.position.x = -1.2; group.add(panel2);
        const antenna = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 8), createMaterial(color));
        antenna.position.y = 0.5; group.add(antenna);
        group.scale.setScalar(1.5);
        return group;
      }

      function createPlanet() {
        const group = new THREE.Group();
        const color = colors[Math.floor(Math.random() * colors.length)];
        group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), createMaterial(color)));
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.1, 8, 32), createMaterial(color, 0.3));
        ring.rotation.x = Math.PI / 2.5; group.add(ring);
        group.scale.setScalar(1.2);
        return group;
      }

      function createAsteroid() {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const asteroid = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), createMaterial(color));
        asteroid.scale.setScalar(0.8 + Math.random() * 0.5);
        return asteroid;
      }

      function createRobot() {
        const group = new THREE.Group();
        const color = colors[Math.floor(Math.random() * colors.length)];
        group.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1), createMaterial(color)));
        const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const eye1 = new THREE.Mesh(eyeGeo, createMaterial(0xffffff, 0.6));
        eye1.position.set(-0.3, 0.2, 0.5); group.add(eye1);
        const eye2 = eye1.clone(); eye2.position.x = 0.3; group.add(eye2);
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8), createMaterial(color));
        antenna.position.y = 0.7; group.add(antenna);
        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), createMaterial(0xffffff, 0.6));
        tip.position.y = 0.95; group.add(tip);
        group.scale.setScalar(1.3);
        return group;
      }

      function createJellyfish() {
        const group = new THREE.Group();
        const color = colors[Math.floor(Math.random() * colors.length)];
        group.add(new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), createMaterial(color, 0.5)));
        for (let i = 0; i < 6; i++) {
          const tentacle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.01, 1.5, 6), createMaterial(color, 0.3));
          const angle = (i / 6) * Math.PI * 2;
          tentacle.position.set(Math.cos(angle) * 0.4, -0.8, Math.sin(angle) * 0.4);
          tentacle.userData.wobbleOffset = i; group.add(tentacle);
        }
        group.scale.setScalar(1.5); group.userData.isJellyfish = true;
        return group;
      }

      function createStarfish() {
        const group = new THREE.Group();
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 5; i++) {
          const arm = new THREE.Mesh(new THREE.ConeGeometry(0.25, 1, 6), createMaterial(color));
          const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
          arm.position.set(Math.cos(angle) * 0.5, 0, Math.sin(angle) * 0.5);
          arm.rotation.z = -Math.PI / 2; arm.rotation.y = -angle; group.add(arm);
        }
        group.add(new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), createMaterial(color)));
        group.rotation.x = Math.PI / 2; group.scale.setScalar(1.2);
        return group;
      }

      function createStar() {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.6, 0), createMaterial(color, 0.5));
        star.scale.y = 1.5;
        return star;
      }

      function createEarth() {
        const group = new THREE.Group();
        group.add(new THREE.Mesh(new THREE.SphereGeometry(1.18, 32, 32), new THREE.MeshBasicMaterial({ color: 0xbfdbfe, wireframe: true, transparent: true, opacity: 0.3 })));
        group.add(new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xbbf7d0, wireframe: true, transparent: true, opacity: 0.25 })));
        const equator = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.02, 8, 48), new THREE.MeshBasicMaterial({ color: 0xbfdbfe, transparent: true, opacity: 0.3 }));
        equator.rotation.x = Math.PI / 2; group.add(equator);
        group.add(new THREE.Mesh(new THREE.SphereGeometry(1.45, 20, 20), new THREE.MeshBasicMaterial({ color: 0xdbeafe, wireframe: true, transparent: true, opacity: 0.1 })));
        const moon = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), new THREE.MeshBasicMaterial({ color: 0xe2e8f0, wireframe: true, transparent: true, opacity: 0.3 }));
        moon.position.set(2, 0.5, 0); group.add(moon);
        group.scale.setScalar(1.8); group.userData.isEarth = true;
        return group;
      }

      function createBlackHole() {
        const group = new THREE.Group();
        group.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xc4b5fd, wireframe: true, transparent: true, opacity: 0.3 })));
        for (let i = 0; i < 3; i++) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(1 + i * 0.4, 0.08 - i * 0.02, 8, 32),
            new THREE.MeshBasicMaterial({ color: [0xd8b4fe, 0xc4b5fd, 0xa5b4fc][i], wireframe: true, transparent: true, opacity: 0.25 - i * 0.05 }));
          ring.rotation.x = Math.PI / 2.2; ring.rotation.z = i * 0.2; group.add(ring);
        }
        group.scale.setScalar(1.8); group.userData.isBlackHole = true;
        return group;
      }

      function createLeaf() {
        const group = new THREE.Group();
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), createMaterial(0xbbf7d0, 0.5));
        leaf.scale.set(0.6, 1, 0.1); group.add(leaf);
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6, 6), createMaterial(0xbbf7d0, 0.4));
        stem.position.y = -0.7; stem.rotation.z = 0.2; group.add(stem);
        const vein = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.8, 6), createMaterial(0xbbf7d0, 0.3));
        vein.rotation.x = Math.PI / 2; group.add(vein);
        group.scale.setScalar(2); group.userData.isLeaf = true;
        return group;
      }

      const creators = [createSatellite, createPlanet, createAsteroid, createRobot, createJellyfish, createStarfish, createStar, createEarth, createBlackHole, createLeaf];

      for (let i = 0; i < 25; i++) {
        const createFn = i < 10 ? creators[i] : creators[Math.floor(Math.random() * creators.length)];
        const obj = createFn();
        const side = Math.random() > 0.5 ? 1 : -1;
        obj.position.x = side * (25 + Math.random() * 35);
        obj.position.y = (Math.random() - 0.5) * 80;
        obj.position.z = (Math.random() - 0.5) * 60 - 20;
        obj.rotation.x = Math.random() * Math.PI;
        obj.rotation.y = Math.random() * Math.PI;
        obj.rotation.z = Math.random() * Math.PI;
        obj.userData.rotSpeed = { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01, z: (Math.random() - 0.5) * 0.005 };
        obj.userData.floatSpeed = Math.random() * 0.3 + 0.2;
        obj.userData.floatOffset = Math.random() * Math.PI * 2;
        obj.userData.originalY = obj.position.y;
        obj.userData.originalX = obj.position.x;
        obj.userData.driftAmplitude = 8 + Math.random() * 12;
        objects.push(obj); scene.add(obj);
      }

      let mouseX = 0, mouseY = 0;
      document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      let time = 0;
      function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        objects.forEach((obj) => {
          obj.rotation.x += obj.userData.rotSpeed.x;
          obj.rotation.y += obj.userData.rotSpeed.y;
          obj.rotation.z += obj.userData.rotSpeed.z;
          obj.position.y = obj.userData.originalY + Math.sin(time * obj.userData.floatSpeed + obj.userData.floatOffset) * 3;
          obj.position.x = obj.userData.originalX + Math.sin(time * 0.15 + obj.userData.floatOffset) * obj.userData.driftAmplitude;
          if (obj.userData.isJellyfish) {
            obj.children.forEach((child, j) => { if (j > 0) { child.rotation.x = Math.sin(time * 2 + j) * 0.3; child.rotation.z = Math.cos(time * 2 + j) * 0.2; } });
          }
          if (obj.userData.isEarth && obj.children[4]) {
            const moon = obj.children[4]; moon.position.x = Math.cos(time * 0.5) * 2; moon.position.z = Math.sin(time * 0.5) * 2;
          }
          if (obj.userData.isBlackHole) {
            obj.children.forEach((child, j) => { if (j > 0) child.rotation.z += 0.02 * (j + 1); });
          }
          if (obj.userData.isLeaf) { obj.rotation.z = Math.sin(time * 0.5) * 0.3; obj.rotation.x = Math.cos(time * 0.3) * 0.2; }
        });
        camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 5 - camera.position.y) * 0.02;
        camera.lookAt(scene.position);
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        objects.forEach(obj => { obj.userData.rotSpeed = { x: 0, y: 0, z: 0 }; obj.userData.floatSpeed = 0; });
      }
    })();
  </script>

  </body>
</html>
